clusters = source, target

source.bootstrap.servers = source-kafka-1:9092,source-kafka-2:9092
source.security.protocol = SASL_SSL
source.sasl.mechanism = PLAIN
source.sasl.jaas.config = org.apache.kafka.common.security.plain.PlainLoginModule required username="${SOURCE_USER}" password="${SOURCE_PASSWORD}";

source.consumer.group.id = mm2-source

source->target.enabled = true
source->target.topics = critical-.*,shared-
source->target.topics.blacklist = .*\.internal
source->target.emit.heartbeats.enabled = true
source->target.emit.checkpoints.enabled = true
source->target.sync.topic.acls.enabled = true
source->target.replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
source->target.refresh.topics.interval.seconds = 300

# Enable offset syncs for consumer failover friendliness
source->target.sync.group.offsets.enabled = true
source->target.offset.lag.max = 100

# Mirror the configuration in the opposite direction for active/active scenarios
# target->source.enabled = true
# target->source.topics = critical-.*

target.bootstrap.servers = target-kafka-1:9092,target-kafka-2:9092
target.security.protocol = SASL_SSL
target.sasl.mechanism = PLAIN
target.sasl.jaas.config = org.apache.kafka.common.security.plain.PlainLoginModule required username="${TARGET_USER}" password="${TARGET_PASSWORD}";

tasks.max = 4
retry.backoff.ms = 5000
